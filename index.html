<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Star Catcher</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #11162b;
      color: #fff;
      font-family: system-ui, sans-serif;
      overflow: hidden;
    }
    #score { font-size: 1.4rem; margin-bottom: 12px; }
    #target {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle, #4f7cff, #2a49b8);
      cursor: pointer;
      position: absolute;
      transition: transform 0.1s;
    }
    #target:active { transform: scale(0.85); }
    #msg { margin-top: 12px; font-size: 0.9rem; opacity: 0.7; }
  </style>
</head>
<body>
  <div id="score">Score: 0</div>
  <div id="target"></div>
  <div id="msg">Click the blue circle!</div>

  <script>
    let score = 0;
    let time = 10;
    const target = document.getElementById('target');
    const scoreEl = document.getElementById('score');
    const msg = document.getElementById('msg');

    function move() {
      const x = Math.random() * (window.innerWidth - 80) + 10;
      const y = Math.random() * (window.innerHeight - 120) + 60;
      target.style.left = x + 'px';
      target.style.top = y + 'px';
    }

    target.addEventListener('click', () => {
      score++;
      scoreEl.textContent = 'Score: ' + score;
      move();
    });

    move();

    const timer = setInterval(() => {
      time--;
      msg.textContent = 'Time left: ' + time + 's';
      if (time <= 0) {
        clearInterval(timer);
        target.style.display = 'none';
        msg.textContent = 'Game over! Final score: ' + score;
      }
    }, 1000);
  </script>
</body>
</html>
